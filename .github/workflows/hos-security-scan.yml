# ============================================================================
# HOS-Forge Security CI/CD — 安全扫描质量门禁
#
# 每次 push/PR 自动执行:
#   1. Reality Score 检测 (调用 HOS-Silly-Mock Skill) — DISABLED
#   2. SAST 代码安全扫描 (Semgrep) — DISABLED
#   3. 依赖漏洞扫描 (pip-audit / npm audit)
#   4. 生成安全报告作为 CI Artifact
#
# 阈值: Reality Score < 50 阻断构建
# ============================================================================

name: HOS Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # ── Job 1: Reality Score Check ─────────────────────────────────
  reality-check:
    name: 🧠 Reality Score (HOS-Silly-Mock)
