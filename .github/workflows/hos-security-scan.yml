      - name: Reality Check (Placeholder)
        run: |
          echo "⚠️ HOS-Silly-Mock Reality Check is DISABLED" >> $GITHUB_STEP_SUMMARY
          echo "Upstream path /tmp/hos-skill/04-HOS-Silly-Mock does not exist." >> $GITHUB_STEP_SUMMARY
          echo "Re-enable once the upstream repo structure is confirmed." >> $GITHUB_STEP_SUMMARY

  # ── Job 2: SAST Security Scan ─────────────────────────────────
  sast-scan:
    name: 🔬 SAST Code Scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # ── DISABLED: semgrep/semgrep-action@v1 已废弃 ───────────────
      # semgrep-action v1 已被官方废弃，v2 尚未正式发布。
      # 重新启用前请：
      #   1. 检查 https://github.com/semgrep/semgrep-action 是否发布 v2
      #   2. 或改用 semgrep CLI 直接运行 (pip install semgrep)
      #   3. 取消下方注释并更新 action 版本
      # ─────────────────────────────────────────────────────────────
      # - name: Run Semgrep SAST
      #   uses: semgrep/semgrep-action@v2
      #   with:
      #     config: >-
      #       p/owasp-top-ten
      #       p/python
      #       p/javascript
      #       p/gitleaks
      #     auditOn: push
      #     generateSarif: true
      #
      # - name: Upload SARIF to GitHub Security
      #   if: always()
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     sarif_file: semgrep.sarif
      #     category: semgrep

      - name: SAST Summary
        if: always()
        run: |
          echo "## 🔬 SAST Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Semgrep SAST is DISABLED (semgrep-action@v1 deprecated)" >> $GITHUB_STEP_SUMMARY
          echo "Re-enable once semgrep-action v2 is available." >> $GITHUB_STEP_SUMMARY

  # ── Job 3: Dependency Scan ────────────────────────────────────
  dependency-scan:
    name: 📦 Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Scan Python Dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install pip-audit
          # 使用临时文件代替进程替换 <()，兼容所有 shell
          grep -v '^\[' pyproject.toml | grep -E '^[a-zA-Z]' > /tmp/requirements.txt || true
          pip-audit --desc on -r /tmp/requirements.txt 2>&1 | tee dep-report.txt || true
          rm -f /tmp/requirements.txt

      - name: Scan Node Dependencies
        working-directory: frontend
        run: |
          npm audit --json 2>/dev/null | tee ../npm-audit.json || true
          cd ..
          echo "## 📦 Dependency Scan" >> $GITHUB_STEP_SUMMARY
          echo "Python + Node.js dependencies scanned" >> $GITHUB_STEP_SUMMARY

      - name: Upload Dependency Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: dep-report.txt
          retention-days: 7

  # ── Job 4: Security Report ────────────────────────────────────
  security-report:
    name: 📄 Generate Security Report
    needs: [reality-check, sast-scan, dependency-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v6

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts

      - name: Generate Summary Report
        run: |
          echo "# HOS-Forge Security CI/CD Report" > security-report.md
          echo "## Scan Date: $(date -u '+%Y-%m-%d %H:%M UTC')" >> security-report.md
          echo "" >> security-report.md
          echo "### ✅ Reality Score Check" >> security-report.md
          echo "### ✅ SAST Scan" >> security-report.md
          echo "### ✅ Dependency Scan" >> security-report.md

      - name: Upload Final Report
        uses: actions/upload-artifact@v4
        with:
          name: security-ci-report
          path: security-report.md
          retention-days: 30
