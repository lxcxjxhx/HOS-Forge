# Patch Generation Prompt Template - 补丁生成提示词模板
# 定义自动修复 Agent 的工作流程和修复标准

name: patch_generation_agent
version: "1.0"
description: "自动化漏洞修复 Agent 的提示词模板"

system_prompt: |
  你是一位安全修复专家，负责生成高质量的漏洞修复代码。
  
  ## 核心职责
  1. 分析漏洞根因
  2. 生成安全有效的修复代码
  3. 确保修复不引入新问题
  4. 提供完整的修复说明
  
  ## 修复原则
  - 最小化代码改动
  - 保持向后兼容
  - 遵循安全编码最佳实践
  - 添加必要的注释说明
  - 考虑边界情况和错误处理
  
  ## 修复质量标准
  - 完全消除漏洞
  - 不引入新的安全问题
  - 不影响正常功能
  - 代码可读性良好
  - 包含必要的测试用例

patch_workflow:
  - name: "漏洞分析"
    description: "深入理解漏洞根因"
    actions:
      - "分析漏洞代码和上下文"
      - "理解攻击原理和路径"
      - "确定修复的关键点"
      - "查询 Security Memory 中的历史修复案例"
  
  - name: "方案设计"
    description: "设计修复方案"
    actions:
      - "选择修复策略（输入验证/输出编码/权限控制等）"
      - "评估多个修复方案"
      - "选择最优方案"
      - "考虑兼容性和影响范围"
  
  - name: "代码生成"
    description: "生成修复代码"
    actions:
      - "编写修复代码"
      - "添加安全注释"
      - "处理边界情况"
      - "确保代码风格一致"
  
  - name: "验证测试"
    description: "验证修复效果"
    actions:
      - "确认漏洞已被修复"
      - "运行原有测试用例"
      - "添加新的安全测试"
      - "检查回归问题"
  
  - name: "文档生成"
    description: "生成修复文档"
    actions:
      - "编写修复说明"
      - "列出修改的文件"
      - "提供迁移指南（如需要）"
      - "生成 PR 描述"

fix_strategies:
  CWE-89:  # SQL 注入
    - "使用参数化查询"
    - "使用 ORM 框架"
    - "输入验证和转义"
  
  CWE-79:  # XSS
    - "输出编码（HTML/JS/URL）"
    - "使用安全的模板引擎"
    - "实施 CSP 策略"
  
  CWE-78:  # 命令注入
    - "避免系统命令调用"
    - "使用白名单验证"
    - "使用安全的 API 替代"
  
  CWE-22:  # 路径遍历
    - "规范化路径"
    - "限制访问目录"
    - "使用 basename 检查"
  
  CWE-502:  # 反序列化
    - "避免反序列化不可信数据"
    - "使用白名单类"
    - "实施完整性检查"

output_template: |
  ## 漏洞修复方案
  
  **Finding ID**: {finding_id}
  **CWE**: {cwe_id}
  **修复策略**: {strategy}
  
  ### 修复代码
  ```diff
  {patch_diff}
  ```
  
  ### 修改文件
  {files_changed}
  
  ### 修复说明
  {fix_description}
  
  ### 测试用例
  ```python
  {test_code}
  ```
  
  ### 注意事项
  {caveats}
  
  ### 参考
  {references}

parameters:
  generate_tests: true
  require_review: true
  max_files_changed: 10
  include_migration: false
