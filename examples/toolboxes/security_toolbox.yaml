# Security Toolbox - 综合安全工具集配置
# 展示如何配置 HOS MCP Hub 中的安全工具

servers:
  # SAST 静态分析工具
  - name: semgrep
    description: "Semgrep 静态代码分析"
    tools:
      - semgrep_scan
      - semgrep_rule_search
      - semgrep_custom_rule
    enabled: true
    config:
      languages:
        - python
        - javascript
        - java
        - go
      severity_filter:
        - ERROR
        - WARNING
      timeout: 300

  # DAST 动态扫描工具
  - name: nuclei
    description: "Nuclei 漏洞扫描器"
    tools:
      - nuclei_scan
      - nuclei_template_search
      - nuclei_custom_template
    enabled: true
    config:
      templates:
        - cves
        - vulnerabilities
        - misconfigurations
      rate_limit: 100
      timeout: 600

  # SCA 软件成分分析
  - name: dependency_check
    description: "依赖项漏洞检查"
    tools:
      - scan_dependencies
      - check_cve
      - analyze_sbom
    enabled: true
    config:
      ecosystems:
        - npm
        - pypi
        - maven
        - golang
      min_severity: MEDIUM

  # 密钥检测工具
  - name: secret_scanner
    description: "密钥和敏感信息检测"
    tools:
      - scan_secrets
      - detect_credentials
      - analyze_git_history
    enabled: true
    config:
      patterns:
        - api_keys
        - passwords
        - tokens
        - certificates
      exclude_patterns:
        - test_data
        - examples

  # 容器安全扫描
  - name: trivy
    description: "容器和镜像漏洞扫描"
    tools:
      - scan_image
      - scan_filesystem
      - scan_config
    enabled: true
    config:
      scanners:
        - vuln
        - config
        - secret
      ignore_unfixed: false
      severity:
        - CRITICAL
        - HIGH
        - MEDIUM

global_config:
  # 全局配置
  parallel_scans: 3
  result_cache_ttl: 3600
  output_format: json
  log_level: INFO
