hos:
  version: "1.0"

workflow:
  name: "CVE Research Workflow"
  description: "Automated CVE research and analysis workflow"
  
  tasks:
    - name: cve_discovery
      agent:
        - cve_researcher
      tools:
        - cve_db
        - exploit_db
      depends_on: []
      timeout: 300
      description: "Discover and collect CVE information"
    
    - name: vulnerability_analysis
      agent:
        - cve_researcher
      tools:
        - nuclei
      depends_on:
        - cve_discovery
      timeout: 600
      description: "Analyze vulnerability details and impact"
    
    - name: exploit_development
      agent:
        - redteam_agent
      tools:
        - metasploit
        - exploit_db
      depends_on:
        - vulnerability_analysis
      timeout: 900
      description: "Develop proof-of-concept exploit"
    
    - name: patch_analysis
      agent:
        - security_engineer
      tools:
        - codeql
        - semgrep
      depends_on:
        - vulnerability_analysis
      timeout: 600
      description: "Analyze vendor patches if available"
    
    - name: report_generation
      agent:
        - security_engineer
      tools: []
      depends_on:
        - exploit_development
        - patch_analysis
      timeout: 300
      description: "Generate comprehensive CVE report"
