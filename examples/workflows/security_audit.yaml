hos:
  version: "1.0"

workflow:
  name: "Security Audit Workflow"
  description: "Complete security audit workflow with static analysis, dynamic testing, and patch generation"
  
  tasks:
    - name: static_scan
      agent:
        - sast_agent
      tools:
        - semgrep
        - codeql
      depends_on: []
      timeout: 300
      description: "Run static application security testing"
    
    - name: dynamic_scan
      agent:
        - dast_agent
      tools:
        - nuclei
        - burp_suite
      depends_on: []
      timeout: 600
      description: "Run dynamic application security testing"
    
    - name: vulnerability_verification
      agent:
        - redteam_agent
      tools:
        - exploit_db
        - metasploit
      depends_on:
        - static_scan
        - dynamic_scan
      timeout: 900
      description: "Verify discovered vulnerabilities with exploit attempts"
    
    - name: patch_generation
      agent:
        - developer_agent
      tools:
        - semgrep
      depends_on:
        - vulnerability_verification
      timeout: 600
      description: "Generate patches for verified vulnerabilities"
    
    - name: security_review
      agent:
        - security_reviewer
      tools:
        - codeql
      depends_on:
        - patch_generation
      timeout: 300
      description: "Review generated patches for correctness"
