name: insecure_random
type: vulnerability
severity: medium
description: "Detects use of insecure random number generators for security-sensitive operations"
logic_operator: OR

patterns:
  - type: regex
    language: python
    pattern: 'random\.random\s*\('
    constraints: {}
  - type: regex
    language: python
    pattern: 'random\.randint\s*\('
    constraints: {}
  - type: regex
    language: python
    pattern: 'random\.choice\s*\('
    constraints: {}
  - type: regex
    language: python
    pattern: 'random\.uniform\s*\('
    constraints: {}
  - type: regex
    language: python
    pattern: 'Math\.random\s*\('
    constraints: {}
  - type: regex
    language: javascript
    pattern: 'Math\.random\s*\('
    constraints: {}

conditions:
  - context: security_sensitive
    requires:
      - secrets.token_bytes
      - secrets.token_hex
      - secrets.token_urlsafe
      - os.urandom
      - crypto.randomBytes

remediation: |
  Never use standard random number generators for security-sensitive operations.
  Use cryptographically secure random number generators instead.
  
  Bad examples:
    import random
    token = random.randint(0, 999999)
    session_id = random.choice(string.ascii_letters)
  
  Good examples (Python):
    import secrets
    token = secrets.token_hex(32)
    session_id = secrets.token_urlsafe(32)
    
    # Or use os.urandom
    import os
    random_bytes = os.urandom(32)
  
  Good examples (JavaScript):
    const crypto = require('crypto');
    const token = crypto.randomBytes(32).toString('hex');

metadata:
  cwe: "CWE-330"
  owasp: "A02:2021 - Cryptographic Failures"
  category: "cryptography"
