name: hardcoded_secret
type: vulnerability
severity: high
description: "Detects hardcoded secrets, API keys, and credentials in source code"
logic_operator: OR

patterns:
  - type: regex
    language: python
    pattern: '(?:password|passwd|pwd)\s*=\s*["\'][^"\']+["\']'
    constraints: {}
  - type: regex
    language: python
    pattern: '(?:api_key|apikey|secret_key|secret)\s*=\s*["\'][^"\']+["\']'
    constraints: {}
  - type: regex
    language: python
    pattern: '(?:token|auth_token|access_token)\s*=\s*["\'][A-Za-z0-9_\-]{16,}["\']'
    constraints: {}

conditions:
  - input_source: source_code
    not_sanitized_by:
      - os.environ
      - os.getenv
      - dotenv

remediation: |
  Never hardcode secrets in source code. Use environment variables or a secrets manager.
  Example:
    # Vulnerable
    API_KEY = "sk-abc123..."
    # Safe
    API_KEY = os.environ.get("API_KEY")

metadata:
  cwe: "CWE-798"
  owasp: "A07:2021 - Identification and Authentication Failures"
  category: "secrets"
