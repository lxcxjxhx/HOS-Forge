name: hardcoded_secret
type: vulnerability
severity: high
description: "Detects hardcoded secrets and credentials"
logic_operator: OR

patterns:
  - type: regex
    language: python
    pattern: 'password\s*=\s*["\'][^"\']+["\']'
    constraints: {}
  - type: regex
    language: python
    pattern: 'api_key\s*=\s*["\'][^"\']+["\']'
    constraints: {}
  - type: regex
    language: python
    pattern: 'secret\s*=\s*["\'][^"\']+["\']'
    constraints: {}
  - type: regex
    language: python
    pattern: 'token\s*=\s*["\'][^"\']+["\']'
    constraints: {}
  - type: regex
    language: javascript
    pattern: 'password\s*[:=]\s*["\'][^"\']+["\']'
    constraints: {}
  - type: regex
    language: javascript
    pattern: 'apiKey\s*[:=]\s*["\'][^"\']+["\']'
    constraints: {}

conditions: []

remediation: |
  Use environment variables or secret management systems instead of hardcoded values.
  Example:
    import os
    password = os.environ.get('DB_PASSWORD')

metadata:
  cwe: "CWE-798"
  owasp: "A07:2021 - Identification and Authentication Failures"
  category: "credential_management"
