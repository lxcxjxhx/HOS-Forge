name: command_injection
type: vulnerability
severity: critical
description: "Detects potential command injection vulnerabilities"
logic_operator: OR

patterns:
  - type: regex
    language: python
    pattern: 'os\.system\s*\(.*\+.*\)'
    constraints: {}
  - type: regex
    language: python
    pattern: 'os\.popen\s*\(.*\+.*\)'
    constraints: {}
  - type: regex
    language: python
    pattern: 'subprocess\.call\s*\(.*\+.*\)'
    constraints: {}
  - type: regex
    language: python
    pattern: 'subprocess\.run\s*\(.*\+.*\)'
    constraints: {}
  - type: regex
    language: python
    pattern: 'subprocess\.Popen\s*\(.*\+.*\)'
    constraints: {}
  - type: regex
    language: python
    pattern: 'shell=True'
    constraints: {}

conditions:
  - input_source: user_input
    not_sanitized_by:
      - shlex_quote
      - shell_escape

remediation: |
  Avoid shell=True and use subprocess with list arguments instead.
  Example:
    subprocess.run(['ls', '-l', user_input], shell=False)

metadata:
  cwe: "CWE-78"
  owasp: "A03:2021 - Injection"
  category: "injection"
