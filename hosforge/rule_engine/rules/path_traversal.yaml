name: path_traversal
type: vulnerability
severity: high
description: "Detects potential path traversal vulnerabilities"
logic_operator: OR

patterns:
  - type: regex
    language: python
    pattern: 'open\s*\(.*\+.*\)'
    constraints: {}
  - type: regex
    language: python
    pattern: 'os\.path\.join\s*\(.*input\s*\('
    constraints: {}
  - type: regex
    language: python
    pattern: 'send_file\s*\(.*\+'
    constraints: {}

conditions:
  - input_source: user_input
    not_sanitized_by:
      - os.path.basename
      - werkzeug.utils.secure_filename
      - pathlib.PurePosixPath

remediation: |
  Always validate and sanitize file paths from user input.
  Use os.path.basename() or werkzeug.utils.secure_filename() to strip directory components.
  Example:
    filename = os.path.basename(user_input)
    filepath = os.path.join(SAFE_DIR, filename)

metadata:
  cwe: "CWE-22"
  owasp: "A01:2021 - Broken Access Control"
  category: "path"
