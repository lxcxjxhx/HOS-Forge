name: xss
type: vulnerability
severity: high
description: "Detects potential Cross-Site Scripting (XSS) vulnerabilities"
logic_operator: OR

patterns:
  - type: regex
    language: python
    pattern: 'render_template_string\s*\(.*\+.*\)'
    constraints: {}
  - type: regex
    language: python
    pattern: 'Markup\s*\(.*\+.*\)'
    constraints: {}
  - type: regex
    language: javascript
    pattern: 'innerHTML\s*=.*\+.*'
    constraints: {}
  - type: regex
    language: javascript
    pattern: 'document\.write\s*\(.*\+.*\)'
    constraints: {}
  - type: regex
    language: typescript
    pattern: 'innerHTML\s*=.*\+.*'
    constraints: {}

conditions:
  - input_source: user_input
    not_sanitized_by:
      - html_escape
      - bleach_clean
      - sanitize_html

remediation: |
  Use proper output encoding/escaping instead of string concatenation.
  Example (Python/Jinja2):
    {{ user_input | e }}
  Example (JavaScript):
    element.textContent = userInput;

metadata:
  cwe: "CWE-79"
  owasp: "A07:2021 - Cross-Site Scripting"
  category: "injection"
