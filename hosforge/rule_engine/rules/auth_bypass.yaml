name: auth_bypass
type: vulnerability
severity: critical
description: "Detects potential authentication bypass vulnerabilities"
logic_operator: OR

patterns:
  - type: regex
    language: python
    pattern: "if\\s+.*password\\s*==\\s*[\"'].*[\"']"
    constraints: {}
  - type: regex
    language: python
    pattern: "if\\s+.*admin\\s*==\\s*[\"'].*[\"']"
    constraints: {}
  - type: regex
    language: python
    pattern: "if\\s+.*user\\s*==\\s*[\"']admin[\"']"
    constraints: {}
  - type: regex
    language: python
    pattern: 'if\s+not\s+.*\.is_authenticated'
    constraints: {}
  - type: regex
    language: python
    pattern: '@login_required.*\n.*def\s+\w+'
    constraints: {}
  - type: taint_flow
    language: python
    pattern: "authenticate|login|check_password"
    constraints:
      sources:
        - request.form
        - request.args
        - request.get
        - input
      sinks:
        - authenticate
        - login
        - check_password
        - verify_password
      sanitizers:
        - hash_password
        - bcrypt.checkpw
        - pbkdf2_sha256.verify

conditions:
  - input_source: user_input
    not_sanitized_by:
      - bcrypt.checkpw
      - pbkdf2_sha256.verify
      - argon2.verify

remediation: |
  Never hardcode credentials or use plain text password comparison.
  Always use proper password hashing and timing-safe comparison:
  
  Example (Python):
    import bcrypt
    
    def verify_password(plain_password, hashed_password):
        return bcrypt.checkpw(
            plain_password.encode('utf-8'),
            hashed_password.encode('utf-8')
        )
  
  Example (Node.js):
    const bcrypt = require('bcrypt');
    const match = await bcrypt.compare(password, hash);

metadata:
  cwe: "CWE-287"
  owasp: "A07:2021 - Identification and Authentication Failures"
  category: "authentication"