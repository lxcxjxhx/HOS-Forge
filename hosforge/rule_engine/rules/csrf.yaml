name: csrf
type: vulnerability
severity: high
description: "Detects potential Cross-Site Request Forgery (CSRF) vulnerabilities"
logic_operator: OR

patterns:
  - type: regex
    language: python
    pattern: "@app\\.route.*methods.*POST"
    constraints: {}
  - type: regex
    language: python
    pattern: "@app\\.route.*methods.*PUT"
    constraints: {}
  - type: regex
    language: python
    pattern: "@app\\.route.*methods.*DELETE"
    constraints: {}
  - type: taint_flow
    language: python
    pattern: "flask.route|django.views"
    constraints:
      sources:
        - request.form
        - request.args
        - request.get
      sinks:
        - db.session.commit
        - db.session.add
        - Model.save
        - Model.delete
      sanitizers:
        - csrf_token
        - validate_csrf
        - csrf_protect

conditions:
  - input_source: user_input
    not_sanitized_by:
      - csrf_token
      - validate_csrf
      - csrf_protect

remediation: |
  Always use CSRF protection for state-changing operations.
  Example (Flask):
    from flask_wtf import CSRFProtect
    csrf = CSRFProtect(app)
  
  Example (Django):
    Use {% csrf_token %} in templates
    Use @csrf_protect decorator for views

metadata:
  cwe: "CWE-352"
  owasp: "A01:2021 - Broken Access Control"
  category: "csrf"
