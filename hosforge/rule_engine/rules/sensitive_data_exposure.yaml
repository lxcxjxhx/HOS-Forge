name: sensitive_data_exposure
type: vulnerability
severity: high
description: "Detects potential sensitive data exposure in logs, responses, or error messages"
logic_operator: OR

patterns:
  - type: regex
    language: python
    pattern: 'print\s*\(.*password'
    constraints: {}
  - type: regex
    language: python
    pattern: 'print\s*\(.*secret'
    constraints: {}
  - type: regex
    language: python
    pattern: 'print\s*\(.*api_key'
    constraints: {}
  - type: regex
    language: python
    pattern: 'print\s*\(.*token'
    constraints: {}
  - type: regex
    language: python
    pattern: 'logging\.info\s*\(.*password'
    constraints: {}
  - type: regex
    language: python
    pattern: 'logging\.debug\s*\(.*password'
    constraints: {}
  - type: regex
    language: python
    pattern: 'return\s+.*password'
    constraints: {}
  - type: regex
    language: python
    pattern: 'jsonify\s*\(.*password'
    constraints: {}
  - type: regex
    language: python
    pattern: 'response\.json\s*\(.*secret'
    constraints: {}

conditions:
  - input_source: sensitive_variable
    not_sanitized_by:
      - mask
      - redact
      - hide

remediation: |
  Never log or expose sensitive data in responses, logs, or error messages.
  
  Bad examples:
    print(f"User password: {password}")
    logging.info(f"API key: {api_key}")
    return jsonify({"password": user.password})
  
  Good examples:
    # Mask sensitive data
    print(f"User authenticated: {user.email}")
    logging.info("API request completed")
    return jsonify({"user": user.email})
    
    # Use proper logging levels
    logger.debug("Processing request", extra={"user_id": user.id})

metadata:
  cwe: "CWE-200"
  owasp: "A02:2021 - Cryptographic Failures"
  category: "data_exposure"
