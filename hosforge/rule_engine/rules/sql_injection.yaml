name: sql_injection
type: vulnerability
severity: critical
description: "Detects potential SQL injection vulnerabilities"
logic_operator: OR

patterns:
  - type: regex
    language: python
    pattern: "(?:execute|cursor\\.execute)\\s*\\(\\s*[\"'].*%s"
    constraints: {}
  - type: regex
    language: python
    pattern: "(?:execute|cursor\\.execute)\\s*\\(\\s*f[\"']"
    constraints: {}
  - type: regex
    language: python
    pattern: "(?:execute|cursor\\.execute)\\s*\\(.*\\+.*\\)"
    constraints: {}

conditions:
  - input_source: user_input
    not_sanitized_by:
      - parameterized_query
      - escape_string

remediation: |
  Use parameterized queries instead of string concatenation or formatting.
  Example:
    cursor.execute("SELECT * FROM users WHERE id = %s", (user_id,))

metadata:
  cwe: "CWE-89"
  owasp: "A03:2021 - Injection"
  category: "injection"
