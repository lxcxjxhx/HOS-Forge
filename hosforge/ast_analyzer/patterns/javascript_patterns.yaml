# JavaScript vulnerability patterns for AST analyzer
patterns:
  # XSS - Cross-Site Scripting
  - name: xss_innerhtml
    severity: high
    pattern_type: innerHTML
    language: javascript
    description: "Potential XSS via innerHTML assignment"
    remediation: "Use textContent or a sanitization library like DOMPurify"
    targets:
      - innerHTML

  - name: xss_document_write
    severity: high
    pattern_type: call
    language: javascript
    description: "Potential XSS via document.write()"
    remediation: "Avoid document.write(); use DOM manipulation methods instead"
    targets:
      - document.write
      - document.writeln

  # Code Injection
  - name: code_injection_eval
    severity: critical
    pattern_type: call
    language: javascript
    description: "Code injection via eval()"
    remediation: "Avoid eval(); use JSON.parse() for JSON data or Function constructor with caution"
    targets:
      - eval
      - Function

  - name: code_injection_settimeout
    severity: medium
    pattern_type: call
    language: javascript
    description: "Potential code injection via setTimeout/setInterval with string argument"
    remediation: "Pass a function instead of a string to setTimeout/setInterval"
    targets:
      - setTimeout
      - setInterval

  # Hardcoded Secrets
  - name: hardcoded_password
    severity: high
    pattern_type: assignment
    language: javascript
    description: "Hardcoded password detected"
    remediation: "Use environment variables or a secrets manager for credentials"
    targets:
      - password
      - passwd
      - pwd

  - name: hardcoded_api_key
    severity: high
    pattern_type: assignment
    language: javascript
    description: "Hardcoded API key detected"
    remediation: "Use environment variables or a secrets manager for API keys"
    targets:
      - api_key
      - apikey
      - api_secret

  - name: hardcoded_token
    severity: high
    pattern_type: assignment
    language: javascript
    description: "Hardcoded token detected"
    remediation: "Use environment variables or a secrets manager for tokens"
    targets:
      - token
      - auth_token
      - access_token

  - name: hardcoded_secret
    severity: high
    pattern_type: assignment
    language: javascript
    description: "Hardcoded secret detected"
    remediation: "Use environment variables or a secrets manager for secrets"
    targets:
      - secret
      - private_key
