hos:
  version: "1.0"

workflow:
  name: "Security Audit Workflow"
  description: "Automated security audit with static analysis, vulnerability verification, patching, and review"
  
  tasks:
    - name: static_scan
      agent:
        - sast_agent
      tools:
        - hos_ls
        - semgrep
      depends_on: []
      timeout: 300
    
    - name: codeql_analysis
      agent:
        - sast_agent
      tools:
        - codeql
      depends_on: []
      timeout: 600
    
    - name: exploit_verify
      agent:
        - redteam_agent
      tools:
        - nuclei
        - exploit_db
      depends_on:
        - static_scan
        - codeql_analysis
      timeout: 600
    
    - name: patch_generation
      agent:
        - developer_agent
      tools:
        - github
      depends_on:
        - exploit_verify
      timeout: 300
    
    - name: security_review
      agent:
        - security_reviewer
      tools: []
      depends_on:
        - patch_generation
      timeout: 180
