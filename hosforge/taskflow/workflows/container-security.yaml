hos:
  version: "1.0"

workflow:
  name: "Container Security Audit Workflow"
  description: "Comprehensive container security audit including image scanning and configuration checks"
  
  tasks:
    - name: image_scan
      agent:
        - sast_agent
      tools:
        - trivy
        - docker_security
      depends_on: []
      timeout: 600
    
    - name: dockerfile_analysis
      agent:
        - sast_agent
      tools:
        - docker_security
      depends_on: []
      timeout: 300
    
    - name: configuration_check
      agent:
        - blue_team
      tools:
        - docker_security
      depends_on:
        - dockerfile_analysis
      timeout: 300
    
    - name: vulnerability_verification
      agent:
        - redteam_agent
      tools:
        - nuclei
      depends_on:
        - image_scan
        - configuration_check
      timeout: 600
    
    - name: remediation
      agent:
        - developer_agent
      tools:
        - github
      depends_on:
        - vulnerability_verification
      timeout: 300
    
    - name: security_report
      agent:
        - security_reviewer
      tools: []
      depends_on:
        - remediation
      timeout: 180
