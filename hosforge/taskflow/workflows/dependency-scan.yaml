hos:
  version: "1.0"

workflow:
  name: "Dependency Vulnerability Scan Workflow"
  description: "Scan project dependencies for known vulnerabilities and generate remediation plan"
  
  tasks:
    - name: npm_audit
      agent:
        - sast_agent
      tools:
        - npm_audit
      depends_on: []
      timeout: 180
    
    - name: pip_audit
      agent:
        - sast_agent
      tools:
        - safety
        - pip_audit
      depends_on: []
      timeout: 180
    
    - name: cargo_audit
      agent:
        - sast_agent
      tools:
        - cargo_audit
      depends_on: []
      timeout: 180
    
    - name: vulnerability_analysis
      agent:
        - cve_researcher
      tools:
        - cve_database
        - nvd_api
      depends_on:
        - npm_audit
        - pip_audit
        - cargo_audit
      timeout: 300
    
    - name: remediation_plan
      agent:
        - developer_agent
      tools: []
      depends_on:
        - vulnerability_analysis
      timeout: 180
    
    - name: update_dependencies
      agent:
        - developer_agent
      tools:
        - github
      depends_on:
        - remediation_plan
      timeout: 300
