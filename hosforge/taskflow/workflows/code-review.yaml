hos:
  version: "1.0"

workflow:
  name: "Security Code Review Workflow"
  description: "Automated security code review with vulnerability detection and remediation suggestions"
  
  tasks:
    - name: static_analysis
      agent:
        - sast_agent
      tools:
        - semgrep
        - codeql
        - hos_ls
      depends_on: []
      timeout: 600
    
    - name: pattern_matching
      agent:
        - sast_agent
      tools:
        - semgrep
      depends_on: []
      timeout: 300
    
    - name: vulnerability_detection
      agent:
        - code_reviewer
      tools:
        - semgrep
        - codeql
      depends_on:
        - static_analysis
        - pattern_matching
      timeout: 600
    
    - name: false_positive_check
      agent:
        - security_reviewer
      tools: []
      depends_on:
        - vulnerability_detection
      timeout: 300
    
    - name: remediation_suggestions
      agent:
        - developer_agent
      tools: []
      depends_on:
        - false_positive_check
      timeout: 300
    
    - name: review_report
      agent:
        - security_reviewer
      tools: []
      depends_on:
        - remediation_suggestions
      timeout: 180
