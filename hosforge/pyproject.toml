[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core" ]

[project]
name = "hosforge"
description = "HOS-Forge: AI Native Security Platform — 跨 IDE 的 AI 安全运行时平台，提供安全检测、规则引擎与知识库"
readme = "README.md"
license = "MIT"
authors = [
  { name = "HOS-Forge Team" },
]
requires-python = ">=3.12,<3.14"
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dynamic = [ "version" ]

# 运行时依赖
dependencies = [
  "datasets>=2.16.0",
  # 向量搜索和嵌入
  "faiss-cpu>=1.7.4",
  # Web 框架
  "fastapi>=0.115.0",

  # MCP 服务器框架
  "fastmcp>=3.2,<4",

  "huggingface-hub>=0.20.0",

  "numpy>=1.24.0",
  "peft>=0.7.0",
  # 系统监控
  "psutil>=5.9.0",

  # YAML 解析
  "pyyaml>=6.0.1",

  # HTTP 客户端
  "requests>=2.31.0",

  "sentence-transformers>=2.2.0",
  # 机器学习框架（可选，用于模型优化）
  "torch>=2.0.0",

  # 进度条
  "tqdm>=4.66.0",

  # Hugging Face 生态
  "transformers>=4.36.0",
]

# 开发依赖
optional-dependencies.dev = [
  "black>=23.12.0",
  "isort>=5.13.0",
  "mypy>=1.8.0",
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.1.0",
]
# 文档依赖
optional-dependencies.docs = [
  "myst-parser>=2.0.0",
  "sphinx>=7.0.0",
  "sphinx-rtd-theme>=2.0.0",
]

[tool.poetry]
version = "0.1.0"

[tool.poetry.scripts]
hos = "hosforge.cli.main:main"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastmcp = ">=3.2,<4"
fastapi = ">=0.115.0"
requests = ">=2.31.0"
psutil = ">=5.9.0"
pyyaml = ">=6.0.1"
torch = ">=2.0.0"
tqdm = ">=4.66.0"
transformers = ">=4.36.0"
peft = ">=0.7.0"
datasets = ">=2.16.0"
huggingface-hub = ">=0.20.0"
rich = ">=13.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=4.1.0"
mypy = ">=1.8.0"
ruff = ">=0.1.0"
black = ">=23.12.0"
isort = ">=5.13.0"

[tool.poetry.group.docs.dependencies]
sphinx = ">=7.0.0"
sphinx-rtd-theme = ">=2.0.0"
myst-parser = ">=2.0.0"

[tool.black]
line-length = 100
target-version = [ "py312" ]

[tool.ruff]
target-version = "py312"

line-length = 100
lint.select = [
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "W",  # pycodestyle warnings
]
lint.ignore = [
  "B008", # do not perform function calls in argument defaults
  "E501", # line too long (handled by black)
]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = [ "tests" ]
python_files = [ "test_*.py" ]
python_classes = [ "Test*" ]
python_functions = [ "test_*" ]
addopts = "-v"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
